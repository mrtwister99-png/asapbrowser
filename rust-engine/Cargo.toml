[package]
name = "myytbrowser_engine"
version = "0.1.0"
edition = "2021"
[lib]
name = "myytbrowser_engine"
crate-type = ["cdylib"]
[dependencies]
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"
once_cell = "1"
adblock = "0.9"
rquickjs = { version = "0.6", features = ["bindgen", "loader"] }
rmp = "=0.8.14"
rmp-serde = "=0.15.5"
[profile.release]
lto = true
opt-level = "z"
panic = "abort"
strip = true